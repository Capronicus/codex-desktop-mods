name: Chat sync across Linux and Windows
on:
  workflow_dispatch:
  push:
    branches: [main, codex/chat-sync, codex/sidebar-palette, codex/sidebar-sync, codex/chat-controls, codex/device-origins, codex/mod-controls, codex/sync-repair, codex/pet-controls, codex/defer-busy-recovery, codex/sidebar-review-panel]
    paths:
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/chat-sync.yml'
      - 'plugins/chat-sync/**'
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @openai/codex@0.167.0-alpha.3.2
      - run: python3 plugins/chat-sync/tests/sync_controls.py
      - run: python3 plugins/chat-sync/tests/account_colours.py
      - run: python3 plugins/chat-sync/tests/mod_controls.py
      - run: python3 plugins/chat-sync/tests/integrity_test.py
      - run: python3 plugins/chat-sync/tests/sidebar_layout_test.py
      - run: python3 plugins/chat-sync/tests/cross_platform.py seed "$RUNNER_TEMP/seed"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-linux-history
          path: ${{ runner.temp }}/seed
          retention-days: 1
  reply:
    needs: seed
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the native Windows desktop app server
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'ChatGPT-x64.msix'
          curl.exe --fail --location --retry 2 https://persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix -o $pkg
          if ($LASTEXITCODE -ne 0) { throw 'MSIX download failed' }
          Add-AppxPackage -Path $pkg
          $installed = Get-AppxPackage -Name OpenAI.Codex
          Write-Output "Windows desktop package $($installed.Version)"
          $exe = Join-Path $installed.InstallLocation 'app/resources/codex.exe'
          & $exe --version
          "CODEX_CHAT_SYNC_CLI=$exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-linux-history
          path: ${{ runner.temp }}/transfer
      - run: python plugins/chat-sync/tests/sync_controls.py
      - run: python plugins/chat-sync/tests/account_colours.py
      - run: python plugins/chat-sync/tests/mod_controls.py
      - run: python plugins/chat-sync/tests/integrity_test.py
      - run: python plugins/chat-sync/tests/sidebar_layout_test.py
      - run: python plugins/chat-sync/tests/cross_platform.py reply "$env:RUNNER_TEMP/transfer"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-windows-reply
          path: ${{ runner.temp }}/transfer
          retention-days: 1
  verify:
    needs: reply
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @openai/codex@0.167.0-alpha.3.2
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-linux-history
          path: ${{ runner.temp }}/seed
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-windows-reply
          path: ${{ runner.temp }}/transfer
      - run: python3 plugins/chat-sync/tests/cross_platform.py verify "$RUNNER_TEMP/seed" --incoming "$RUNNER_TEMP/transfer"
