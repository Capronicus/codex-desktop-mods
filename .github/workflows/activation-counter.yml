name: Opt-in activation counter
on:
  push:
    paths:
      - '**/activation.py'
      - 'activation.py'
      - 'server.py'
      - 'plugins/chat-sync/server.py'
      - 'counter/**'
      - 'tests/activations.py'
      - '.github/workflows/activation-counter.yml'
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/activations.py
