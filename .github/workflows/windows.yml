name: Windows desktop mods
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sidebar-*.js'
      - 'sidebar-colours.py'
      - 'renderer_updates.py'
      - 'chat-details-*.cjs'
  push:
    branches: [main, codex/device-chat-actions, windows-port, codex/sidebar-palette, codex/chat-controls, codex/device-origins, codex/mod-controls, codex/pet-controls, codex/recover-desktop-metadata]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read plain and compressed chat histories
        run: node tests/chat-details.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the installer and native Start menu shortcut
        run: python tests/test_windows.py
      - name: Install the official ChatGPT desktop package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:RUNNER_TEMP 'ChatGPT-x64.msix'
          curl.exe --fail --location --retry 2 https://persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix -o $pkg
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the official MSIX.' }
          Add-AppxPackage -Path $pkg
      - name: Install Chat Organizer from the marketplace in a fresh profile
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'organizer-profile'
          New-Item -ItemType Directory -Path $env:CODEX_HOME -Force | Out-Null
          $package = Get-AppxPackage -Name OpenAI.Codex
          $codex = Join-Path $package.InstallLocation 'app/resources/codex.exe'
          & $codex plugin marketplace add $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $codex plugin add chat-organizer@capronicus-desktop-mods
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $plugins = & $codex plugin list --json | ConvertFrom-Json
          $organizer = $plugins.installed | Where-Object pluginId -eq 'chat-organizer@capronicus-desktop-mods'
          if (-not $organizer.enabled) { throw 'Chat Organizer was not enabled.' }
      - name: Launch the patched Store build with a disposable profile
        run: python tests/windows_store_smoke.py
